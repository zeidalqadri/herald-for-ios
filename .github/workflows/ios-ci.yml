name: iOS CI

on:
  push:
    branches: [ main, master, 'meshkit/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Xcode build + test (macOS, uses xcodeproj + Herald scheme which has test targets)
  # SPM Linux build+test is in unit_tests.yml
  xcodebuild:
    name: Xcode Build + Test (iOS Simulator)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        run: |
          xcodebuild clean test \
            -project Herald-for-iOS.xcodeproj \
            -scheme Herald \
            -destination 'platform=iOS Simulator,OS=17.2,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO
