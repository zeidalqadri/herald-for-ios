name: iOS CI

on:
  push:
    branches: [ main, master, 'meshkit/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  swift-test:
    name: Swift Package Tests (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

  xcodebuild:
    name: Xcode Build (iOS Simulator)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build for simulator
        run: |
          xcodebuild build \
            -scheme Herald-for-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -project Herald-for-iOS.xcodeproj \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || true

      - name: Run tests on simulator
        run: |
          xcodebuild test \
            -scheme Herald-for-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -project Herald-for-iOS.xcodeproj \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || true
